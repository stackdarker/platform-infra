apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      # Enables exemplar jump-to-trace (when Spring exposes exemplars)
      exemplarTraceIdDestinations:
        - name: Tempo
          datasourceUid: tempo

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: traceId
          matcherRegex: '(?:traceId|trace_id)=([0-9a-f]{16,32})'
          url: '$${__value.raw}'
          datasourceUid: tempo
        - name: spanId
          matcherRegex: '(?:spanId|span_id)=([0-9a-f]{16})'
          url: '$${__value.raw}'
          datasourceUid: tempo

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # Traces → Logs 
      tracesToLogsV2:
        datasourceUid: loki
        tags: ["service", "container", "project"]
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        query: '{project="platform-infra",service="platform-auth-service"} |~ "traceId={{.TraceId}}"'
      # Traces → Metrics 
      tracesToMetrics:
        datasourceUid: prometheus
        tags: ["service", "job"]
